[package]
name = "ncore-tokio"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
futures-util = "0.3.34"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "http2", "ring", "webpki-roots", "tls12"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "http2", "tokio"] }
ncore = { version = "0.1.0", path = "../ncore" }
tokio = { version = "1.53.3", features = ["rt", "time", "net", "io-util", "process", "sync", "macros"] }
tower-service = "0.3.3"

[dev-dependencies]
hyper = { version = "1.12.0", features = ["server", "http1"] }
tokio = { version = "1.53.3", features = ["full"] }
