[package]
name = "ncore-core"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[dev-dependencies]
proptest = "1.12.0"
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }
